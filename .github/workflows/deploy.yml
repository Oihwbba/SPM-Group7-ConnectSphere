name: Deploy to production

# Vercel's Hobby plan deploys a private repository's commit only when its git
# author is the account owner, so every teammate-authored merge left
# production blocked until Jin Hong re-landed the work under his own name.
# This deploys every push to `main` with the owner's token instead, so who
# wrote the commit no longer decides whether it ships. Vercel's own Git
# deployments are switched off in vercel.json, so this is the only path to
# production. See ADR 0009.
#
# One-time setup (repo owner): create a token at
# https://vercel.com/account/settings/tokens scoped to the Hobby team, then add
# it as the repository secret VERCEL_TOKEN.

on:
  push:
    branches: [main]
  # Redeploy by hand, e.g. after rotating the token or changing an env var.
  workflow_dispatch:

# One production deploy at a time, in push order. Never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Records each deploy as a GitHub deployment, so the commit shows
  # "deployed to Production" with a link, as Vercel's own check used to.
  deployments: write

env:
  # Not secrets: they identify the project, and grant nothing without the token.
  VERCEL_ORG_ID: team_aFWraTFfLZLJVG4QgKaz0XL8
  VERCEL_PROJECT_ID: prj_E0y6Vwx0hJebdC4PBE1fG7oz1nx3
  VERCEL_CLI: vercel@59.25.0

jobs:
  deploy:
    # A manual run from the Actions tab can pick any branch. Only main ships.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The CLI reads VERCEL_TOKEN from the environment, so the token never
      # appears on a command line.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require the token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set, so production cannot deploy. Add the repository secret (see the top of this workflow)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The same Node CI tests with, so production cannot build on another.
          node-version-file: .nvmrc

      # Shows the deploy on the commit from the start, as "in progress".
      - name: Open a GitHub deployment
        id: github-deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" --jq .id --input - <<JSON
          {"ref": "${{ github.sha }}", "environment": "Production", "production_environment": true,
           "auto_merge": false, "required_contexts": []}
          JSON
          )
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -f state=in_progress > /dev/null

      # Pulls the project settings and the production environment variables,
      # so the build sees exactly what a Vercel-side build would.
      - name: Pull production settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production

      # The shared database moves with the code: every merge applies its
      # pending migrations before the build, so production never runs code
      # that expects a column the database doesn't have yet. `migrate deploy`
      # only applies what isn't applied and never resets. If it fails, the job
      # stops here and production keeps the previous version.
      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations to the production database
        run: node .github/scripts/migrate-production.mjs

      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod

      # The CLI reads the commit author out of .git and sends it with the
      # deployment. Removing it after the build means the deployment carries
      # no git author at all and is attributed to the token's owner — the
      # whole point. The commit is still recorded, as deployment metadata.
      - name: Deploy
        id: vercel
        run: |
          rm -rf .git
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod \
            --meta githubCommitSha="${{ github.sha }}" \
            --meta githubCommitRef="${{ github.ref_name }}"

      # Success links the commit to production; a failed build or deploy is
      # marked on the commit too, so a stuck production shows without opening
      # the Actions tab.
      - name: Record the result on the commit
        if: always() && steps.github-deployment.outputs.id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=failure
          if [ "${{ steps.vercel.outcome }}" = success ]; then state=success; fi
          gh api "repos/${{ github.repository }}/deployments/${{ steps.github-deployment.outputs.id }}/statuses" \
            -f state="$state" \
            -f environment_url=https://spm-group7-connect-sphere.vercel.app \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
