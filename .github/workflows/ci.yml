name: CI

# Runs on every pull request and every push to main. The pipeline must be
# green from the first commit — its date is graded evidence of continuous
# integration.
#
# Not on pushes to other branches: a branch with an open pull request would
# run the same job twice per commit, and the pull_request run is the stronger
# one — it tests the branch merged into the current main, which is what the
# merge gate and the GLM reviewer read.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only checks out code, runs tests and uploads
# artifacts (which needs no token scope), and a pull_request run executes
# PR-authored code such as npm's postinstall.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the now-stale run. Runs on
# main are never cancelled: every commit there keeps its own CI result, which
# is graded evidence of continuous integration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A normal run takes 11–18 minutes (Oct 2026). 35 leaves room for a slow
    # runner, which at 20 was cancelled before e2e even started (SCRUM-231),
    # and still stops a hung Postgres or Playwright step long before the
    # 360-minute default.
    timeout-minutes: 35

    # Postgres for the whole job: migrations, seed, and the Playwright run all
    # talk to this service container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere
          POSTGRES_DB: connectsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectsphere -d connectsphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local Postgres needs no pooler, so both URLs point at the same service.
      DATABASE_URL: postgresql://connectsphere:connectsphere@localhost:5432/connectsphere?schema=public
      DIRECT_URL: postgresql://connectsphere:connectsphere@localhost:5432/connectsphere?schema=public
      # A fixed secret is fine for CI — no real users exist here.
      AUTH_SECRET: ci-not-a-real-secret-please-change-in-prod
      # Needed here because CI has no proxy to infer the host from. It is
      # deliberately NOT set in production — see the README.
      AUTH_URL: http://localhost:3000
      # No AUTH_TRUST_HOST: it is `trustHost: true` in auth.config.ts, so it
      # cannot be forgotten or mis-quoted in any environment.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 LTS (SCRUM-89): Node 20 reached end-of-life on 2026-04-30, and
      # the v7 actions run on the Node 24 runtime. The version is read from
      # .nvmrc, the single source of truth for CI and local development.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, so the client is ready.
      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed the database
        run: npm run db:seed

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself via `webServer`.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
