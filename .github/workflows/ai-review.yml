name: GLM Code Review

# SCRUM-88 — ONE GLM-5.3 reviewer reads the whole pull request diff in one call
# and posts ONE long review as a PR comment in the Conversation tab: a verdict,
# an overview, the story's acceptance criteria, and a section per finding with a
# "Where:" reference to the exact line. No inline comments; the comment updates
# in place on each push. It replaces the Copilot review.
#
# Context: the PR title, description and branch, CONTRIBUTING.md, CLAUDE.md, and
# the docs/backlog story file for each SCRUM key the PR names.
#
# The check turns red when the review finds a critical issue, or when no review
# could be completed. It is a required status check on `main` alongside
# `build-and-test`, so neither can merge. If GLM stops before answering, the
# script retries once with less thinking. See docs/adr/0008.
#
# One-time setup (repo owner): Settings -> Secrets and variables -> Actions ->
# New repository secret `ZHIPU_API_KEY`. Until it exists the review is skipped.
# The reviewer's instructions live in .github/ai-review/instructions.md.

on:
  # `pull_request`, NOT `pull_request_target`: every branch lives in this repo,
  # so the secret is still available, and PR code never runs with it in a
  # privileged context.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# A new push to the same PR cancels the review still running for the old diff.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Posts and updates the review comment on the pull request.
  pull-requests: write

jobs:
  review:
    # Drafts are work in progress and can't be merged. Edits are never skipped:
    # a skipped job counts as a passing required check and would replace a red
    # result on the same commit.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Both actions are pinned to commit SHAs, not tags: this job holds the API
      # key and GitHub token, and a tag can be moved underneath it. v7 runs on
      # the Node 24 runtime (Node 20 reached end-of-life on 2026-04-30).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review diffs the PR's base against its head, and reads the
          # reviewer, its rules and the story files from the base commit.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: GLM-5.3 review (fails on a critical finding)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Untrusted text goes through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Run the reviewer as it exists on the BASE branch, not the PR's copy: a
        # pull request must not be able to change the code that holds the API
        # key, or the rules it is judged by. Changes to the reviewer therefore
        # take effect once they are merged. No third-party action and no npm
        # packages: Node's built-in fetch only.
        run: |
          git show "$BASE_SHA:.github/scripts/ai-review.mjs" > "$RUNNER_TEMP/ai-review.mjs"
          node "$RUNNER_TEMP/ai-review.mjs"
