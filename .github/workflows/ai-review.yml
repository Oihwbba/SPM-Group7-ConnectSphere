name: GLM Code Review

# SCRUM-88 — ONE GLM-5.3 reviewer reads the whole pull request diff in one call
# and posts ONE long review as a PR comment in the Conversation tab: a verdict,
# an overview, and a section per finding with a "Where:" reference linking to
# the exact line. No inline comments; the comment updates in place on each push.
# It replaces the Copilot review.
#
# The check turns red when the review finds critical or high issues. It is not
# a required status check, so it never blocks merging: `build-and-test` stays
# the only merge gate and a human decides. See docs/adr/0008.
#
# One-time setup (repo owner): Settings -> Secrets and variables -> Actions ->
# New repository secret `ZHIPU_API_KEY`. Until it exists the review is skipped.
# The reviewer's instructions live in .github/ai-review/instructions.md.

on:
  # `pull_request`, NOT `pull_request_target`: every branch lives in this repo,
  # so the secret is still available, and PR code never runs with it in a
  # privileged context.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the review still running for the old diff.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Posts and updates the review comment on the pull request.
  pull-requests: write

jobs:
  review:
    # Drafts are work in progress — don't spend API quota on them.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Both actions are pinned to commit SHAs, not tags: this job holds the API
      # key and GitHub token, and a tag can be moved underneath it. v7 runs on
      # the Node 24 runtime (Node 20 reached end-of-life on 2026-04-30).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review diffs the PR's base against its head.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: GLM-5.3 review (fails on critical or high findings)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # No third-party action and no npm packages: Node's built-in fetch only.
        run: node .github/scripts/ai-review.mjs
