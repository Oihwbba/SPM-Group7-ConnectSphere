name: GLM Code Review

# SCRUM-88 — ONE GLM-5.3 reviewer reads the whole pull request diff in one call
# and posts ONE pull request review: a findings table at the top whose rows link
# straight to inline comments on the changed lines. It replaces the Copilot
# review. Advisory only: not a required status check, so `build-and-test` stays
# the only merge gate and a human still reviews. See docs/adr/0008.
#
# One-time setup (repo owner): Settings -> Secrets and variables -> Actions ->
# New repository secret `ZHIPU_API_KEY`. Until it exists the review is skipped.
# The reviewer's instructions live in .github/ai-review/instructions.md.

on:
  # `pull_request`, NOT `pull_request_target`: every branch lives in this repo,
  # so the secret is still available, and PR code never runs with it in a
  # privileged context.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the review still running for the old diff.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Drafts are work in progress — don't spend API quota on them.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The review diffs the PR's base against its head.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: GLM-5.3 review (one reviewer, whole diff)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # No third-party action and no npm packages: Node's built-in fetch only.
        run: node .github/scripts/ai-review.mjs
